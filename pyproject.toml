[project]
name = "yolov4-pytorch"
version = "0.1.0"
description = "PyTorch implementation of YOLOv4 object detection, compatible with Darknet .cfg and .weights files."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "tensorboard>=2.16",
    "pycocotools>=2.0.7",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "datasets", "utilities", "streaming"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
